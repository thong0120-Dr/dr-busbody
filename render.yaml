services:
  - type: web
    name: dr-busbody
    env: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: COOKIE_SECURE
        value: 1
      - key: TRUST_PROXY
        value: 1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
