<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DR Bus Body · ใบเสนอราคา & ใบวางบิล</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14202b;--mute:#6b7885;--line:#e4e9ee;--brand:#0f766e;--brand2:#f59e0b;--soft:#e6f4f2;--bad:#dc2626;--ok:#16a34a;--warn:#d97706;--sh:0 1px 2px rgba(20,32,43,.06),0 8px 24px rgba(20,32,43,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141a;--card:#16212a;--ink:#e8eef3;--mute:#8d9ba8;--line:#25323d;--soft:#12332f;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d141a;--card:#16212a;--ink:#e8eef3;--mute:#8d9ba8;--line:#25323d;--soft:#12332f;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Noto Sans Thai',system-ui,'Segoe UI',Tahoma,sans-serif}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh;max-width:100vw;overflow-x:hidden}
aside{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.logo b{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#14b8a6);color:#fff;font-size:15px}
.logo span{font-weight:700;line-height:1.2}.logo small{display:block;color:var(--mute);font-weight:400;font-size:11px}
nav button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mute);font-weight:500}
nav button:hover{background:var(--bg)}nav button.on{background:var(--soft);color:var(--brand)}
.sp{flex:1}
main{padding:24px 28px;width:100%;min-width:0;box-sizing:border-box}
h1{font-size:22px;margin:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.sub{color:var(--mute);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;font-weight:500}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.s{padding:4px 8px;font-size:12.5px;border-radius:8px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;line-height:1.35}.btn.d{color:var(--bad)}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(4,1fr)}.k2{grid-template-columns:2fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.kpi small{color:var(--mute)}.kpi h2{margin:4px 0 2px;font-size:24px}.kpi i{font-style:normal;font-size:12px;color:var(--mute)}
.kpi.a{background:linear-gradient(135deg,var(--brand),#115e59);color:#fff;border:0}.kpi.a small,.kpi.a i{color:#d1fae5}
h3{margin:0 0 12px;font-size:16px}
.chart{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars div{width:30%;max-width:20px;border-radius:6px 6px 0 0;min-height:2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:8px}.legend u{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;text-decoration:none}
.wrap{overflow-x:auto;width:100%}table{width:100%;border-collapse:collapse;table-layout:auto}th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}tr:last-child td{border:0}.r{text-align:right;white-space:nowrap}.c{text-align:center;white-space:nowrap}.nowrap{white-space:nowrap}.acts{display:inline-flex;align-items:center;justify-content:flex-end;gap:4px;white-space:nowrap}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);color:var(--mute)}
.tag.ok{background:#16a34a22;color:var(--ok)}.tag.warn{background:#f59e0b24;color:var(--warn)}.tag.bad{background:#dc262622;color:var(--bad)}.tag.info{background:var(--soft);color:var(--brand)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
.f{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}.f .w2{grid-column:span 2}.f .w4{grid-column:span 4}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs .btn.on{background:var(--soft);color:var(--brand);border-color:var(--brand)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:50}
.mask.open{display:flex}.modal{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:860px}
.it input{padding:6px 8px}.tot{margin-left:auto;width:290px;margin-top:12px}.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .g{font-size:18px;font-weight:700;color:var(--brand);border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.empty{padding:30px;text-align:center;color:var(--mute)}
#pa{display:none}
#login{display:none;min-height:100vh;place-items:center;padding:20px}.lg{width:100%;max-width:380px;text-align:center}.lg img{width:90px;margin-bottom:6px}.lg h1{margin:6px 0 4px}.lg input{margin-bottom:10px}.err{color:var(--bad);font-size:13px;min-height:20px;margin-bottom:6px}#who{padding:8px 4px;font-size:13px}.nop .pc{display:none!important}.bn{display:none!important}.it select{padding:6px 8px}.bn{overflow-x:auto}.bn button{flex:0 0 auto!important;min-width:74px}
.bn{display:none}
@media (max-width:860px){.app{grid-template-columns:78px minmax(0,1fr)}aside{padding:10px 4px;gap:4px;overflow-y:auto}.logo{padding:2px 0 8px;justify-content:center}.logo span{display:none}.logo img{width:40px!important}nav button{flex-direction:column;gap:2px;padding:8px 2px;text-align:center;font-size:10.5px;line-height:1.2;justify-content:center}nav .ic{font-size:20px}#sync,.wn{display:none}#who{padding:4px 0;text-align:center}#who .btn,#coBtn{width:100%;padding:8px 2px;text-align:center}.lb2{display:none}
main{padding:16px 10px 30px}.k4{grid-template-columns:1fr 1fr}.k2{grid-template-columns:1fr}.f{grid-template-columns:1fr 1fr}.f .w2,.f .w4{grid-column:span 2}.tot{width:100%}}
@media print{body{background:#fff;color:#000}.app,.mask,.bn,#login{display:none!important}#pa{display:block!important;padding:0;color:#000}}
#pa .h{display:flex;justify-content:space-between;border-bottom:3px solid #0f766e;padding-bottom:12px;margin-bottom:16px}
#pa table td,#pa table th{border:1px solid var(--c2);padding:6px 8px;color:#000}#pa th{background:var(--c3,#e3eef8);-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style>
</head>

/* ---------- storage ---------- */
async function api(m,u,b){
  const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined,credentials:'same-origin'});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&me&&!u.includes('login')){me=null;render()}
  if(!r.ok)throw new Error(j.error||'error');
  return j;
}
async function init(){
  $('#sync').textContent='🖥️ เก็บข้อมูลบนเซิร์ฟเวอร์';
  try{const st=await api('GET','/api/status');needSetup=st.setup;me=st.me||null}catch(e){}
  loaded=true;
  if(me)await pull();
  render();
  setInterval(()=>{if(me&&!$('#mask').classList.contains('open')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))pull()},15000);
}
async function pull(){
  try{
    const j=await api('GET','/api/state'),k=JSON.stringify(j);
    if(k===last)return;last=k;
    S.docs=j.docs;S.jobs=j.jobs||[];S.cust=j.cust;S.files=j.files||[];S.deposits=j.deposits||[];S.co={...S.co,...j.co};S.users=j.users||[];render();
  }catch(e){}
}
const CM={docs:'docs',cust:'customers',users:'users',jobs:'jobs',files:'files',deposits:'deposits'};
async function save(col,o){
  try{await api('PUT','/api/'+CM[col]+'/'+o.id,o)}catch(e){alert('บันทึกไม่สำเร็จ: '+e.message);throw e}
  await pull();
}
async function del(col,id){
  if(!confirm('ยืนยันการลบ?'))return;
  try{await api('DELETE','/api/'+CM[col]+'/'+id)}catch(e){alert(e.message);return}
  await pull();
}

/* ---------- calc ---------- */
const vmOf=d=>d.vm||(d.vat?'out':'none');
const calc=d=>{const sub=(d.items||[]).reduce((a,i)=>a+(+i.q||0)*(+i.p||0),0),dis=+d.dis||0,base=Math.max(sub-dis,0),vm=vmOf(d);let vat=0,tot=base;if(vm==='out'){vat=base*.07;tot=base+vat}else if(vm==='in'){vat=base*7/107}return{sub,dis,base,vat,tot,net:tot-vat,vm}};
function trows(c){const r=[['รวมเป็นเงิน'+(c.vm==='in'?' (รวม VAT)':''),money(c.sub)],['ส่วนลด','-'+money(c.dis)]];if(c.vm==='out')r.push(['VAT 7%',money(c.vat)]);if(c.vm==='in'){r.push(['มูลค่าก่อนภาษี',money(c.net)]);r.push(['VAT 7%',money(c.vat)])}return r}
const overdue=d=>d.type==='bill'&&d.status==='รอชำระ'&&d.due&&d.due<today();
function tag(d){
  const s=overdue(d)?'เกินกำหนด':d.status;
  const c={'อนุมัติ':'ok','ชำระแล้ว':'ok','ออกแล้ว':'ok','ส่งมอบแล้ว':'ok','ยกเลิก':'bad','ส่งแล้ว':'info','รอชำระ':'warn','เกินกำหนด':'bad','ปฏิเสธ':'bad'}[s]||'';
  return `<span class="tag ${c}">${esc(s)}</span>`;
}
function nextNo(type){
  const p=PF[type],ym=today().slice(2,4)+today().slice(5,7);
  const n=S.docs.filter(d=>d.no&&d.no.startsWith(`${p}-${ym}`)).length+1;
  return `${p}-${ym}-${String(n).padStart(3,'0')}`;
}

const isAdmin=()=>me&&me.role==='admin';
async function logout(){try{await api('POST','/api/logout')}catch(e){}me=null;tab='dash';last='';S.docs=[];S.cust=[];S.users=[];S.jobs=[];S.files=[];S.deposits=[];render()}
function loginHtml(m){
  const st=m==='setup',k=`onkeydown="if(event.key==='Enter')${st?'doSetup()':'doLogin()'}"`;
  return `<div class="card lg"><img src="${LH}" alt=""><h1>${st?'ตั้งค่าผู้ดูแลระบบ':'เข้าสู่ระบบ'}</h1><div class="sub" style="margin-bottom:16px">${st?'สร้างบัญชีแอดมินคนแรกเพื่อเริ่มใช้งาน':esc(S.co.name)}</div>
  ${st?'<input id="l_n" placeholder="ชื่อ-นามสกุล">':''}<input id="l_u" placeholder="ชื่อผู้ใช้" autocomplete="username" ${k}><input id="l_p" type="password" placeholder="รหัสผ่าน${st?' (อย่างน้อย 6 ตัว)':''}" autocomplete="${st?'new-password':'current-password'}" ${k}>
  <div class="err" id="l_e"></div><button class="btn p" style="width:100%" onclick="${st?'doSetup()':'doLogin()'}">${st?'สร้างบัญชีแอดมิน':'เข้าสู่ระบบ'}</button></div>`;
}
async function doLogin(){
  try{const j=await api('POST','/api/login',{username:$('#l_u').value.trim(),password:$('#l_p').value});me=j.me;last='';await pull();render()}

async function doSetup(){
  const n=$('#l_n').value.trim(),un=$('#l_u').value.trim().toLowerCase(),pw=$('#l_p').value;
  if(!n||!un||pw.length<6){$('#l_e').textContent='กรอกให้ครบ และรหัสผ่านอย่างน้อย 6 ตัวอักษร';return}
  try{const j=await api('POST','/api/setup',{name:n,username:un,password:pw});needSetup=false;me=j.me;last='';await pull();render()}
  catch(e){$('#l_e').textContent=e.message}
}

  L.style.display='none';L.dataset.m='';ap.style.display='';bn.style.display='';

}

function editUser(id){

  <div style="text-align:right"><button class="btn p" onclick="saveUser(${id?1:0})">บันทึก</button></div>`);

async function saveUser(edit){
  const n=$('#u_n').value.trim(),un=$('#u_u').value.trim().toLowerCase(),pw=$('#u_p').value,role=$('#u_r').value,e=$('#u_e');
  if(!n||!un){e.textContent='กรอกชื่อและชื่อผู้ใช้';return}
  if(!edit&&pw.length<6||pw&&pw.length<6){e.textContent='รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';return}
  if(S.users.some(x=>x.username===un&&x.id!==cur.id)){e.textContent='ชื่อผู้ใช้นี้ถูกใช้แล้ว';return}
  if(role!=='admin'&&!S.users.some(x=>x.role==='admin'&&x.id!==cur.id)){e.textContent='ต้องมีแอดมินอย่างน้อย 1 คน';return}
  const u={id:cur.id,name:n,username:un,role};
  if(pw)u.password=pw;
  try{await save('users',u)}catch(err){e.textContent=err.message;return}
  if(u.id===me.id)me={...me,name:n,username:un,role};
  closeM();
}

function nextOf(d){
  const t=d.type==='quote'?'bill':d.type==='bill'?'receipt':null;if(!t)return null;
  return S.docs.find(x=>x.type===t&&(x.srcId===d.id||(x.ref||'').includes('อ้างอิง '+d.no)))||null;
}
function conv(d){
  if(d.type==='receipt'||d.type==='delivery')return '';
  const n=nextOf(d),w=d.type==='quote'?'ใบวางบิล':'ใบเสร็จ';
  let h=n?`<span class="tag ok" title="ออกซ้ำไม่ได้ หากต้องการเอกสารใหม่ให้สร้างใบใหม่">ออก${w}แล้ว ${esc(n.no)}</span>`:(d.type==='quote'?`<button class="btn s" onclick="toBill('${d.id}')">→ วางบิล</button>`:`<button class="btn s" onclick="toReceipt('${d.id}')">→ ใบเสร็จ</button>`);
  if(d.type==='bill'){
    const dv=S.docs.find(x=>x.type==='delivery'&&((x.srcId&&x.srcId===d.id)||(x.ref||'').includes('อ้างอิง '+d.no)));
    h+=dv?` <span class="tag ok" title="ออกใบส่งมอบงานแล้ว">ออกใบส่งมอบแล้ว ${esc(dv.no)}</span>`:` <button class="btn s" onclick="toDelivery('${d.id}')">→ ใบส่งมอบ</button>`;
  }
  return h;
}
function docTable(a){
  if(!a.length)return '<div class="empty">ยังไม่มีเอกสาร — กดปุ่ม “+” เพื่อเริ่มสร้าง</div>';
  return `<div class="wrap"><table><tr><th class="nowrap">เลขที่</th><th class="nowrap">ประเภท</th><th>ลูกค้า</th><th class="nowrap">วันที่</th><th class="r nowrap">ยอดรวม</th><th class="nowrap">สถานะ</th><th class="r"></th></tr>`+
  a.map(d=>{
    const cdt=d.createdAt||d.updatedAt;
    const timeStr=cdt?`⏱️ ${fdt(cdt)}`:(d.date?`⏱️ ${fd(d.date)}`:'');
    return `<tr><td class="nowrap"><b>${esc(d.no)}</b>${d.by?`<br><small class="sub">โดย ${esc(d.by)}</small>`:''}${timeStr?`<br><small class="sub" title="วันเวลาที่จัดทำเอกสาร">${timeStr}</small>`:''}</td><td class="nowrap">${TT[d.type]}</td><td style="word-break:break-word;max-width:280px">${esc(d.cname)}</td><td class="nowrap">${d.date?fd(d.date):'<span class="sub">-</span>'}</td><td class="r nowrap">${d.type==='delivery'?'-':'฿'+money(calc(d).tot)}</td><td class="nowrap">${tag(d)}</td>
  <td class="r"><div class="acts"><button class="btn s" onclick="edit('${d.type}','${d.id}')">เปิด</button><button class="btn s" onclick="prt('${d.id}')">🖨</button>${conv(d)}${isAdmin()?`<button class="btn s d" onclick="del('docs','${d.id}')">ลบ</button>`:''}</div></td></tr>`;
  }).join('')+'</table></div>';
}

function nextJobNo(){const ym=today().slice(2,4)+today().slice(5,7);const n=S.jobs.filter(j=>(j.no||'').startsWith('JB-'+ym)).length+1;return 'JB-'+ym+'-'+String(n).padStart(3,'0')}
function jobIncome(j){
  const items=jobDocs(j).filter(d=>d.type!=='delivery').map(d=>{
    const nx=nextOf(d),later=nx&&!(nx.type==='receipt'&&nx.status==='ยกเลิก');
    let why='';
    if(later)why='มีใบถัดไปแล้ว';
    else if(d.type==='quote'&&d.status!=='อนุมัติ')why='ใบเสนอราคายังไม่อนุมัติ';
    else if(d.type==='receipt'&&d.status==='ยกเลิก')why='ยกเลิก';
    return{d,why,counted:!why,net:calc(d).net};
  });
  const auto=items.filter(x=>x.counted).reduce((s,x)=>s+x.net,0),m=parseFloat(j.incomeM);
  return{items,auto,income:isNaN(m)?auto:m,manual:!isNaN(m)};
}
const jobCost=j=>(j.exp||[]).reduce((s,e)=>s+(+e.a||0),0);

}

function getFileBlob(f){
  if(!f||!f.data)return null;
  try{
    const parts=f.data.split(',');
    const mime=(parts[0].match(/:(.*?);/)||[])[1]||'application/pdf';
    const bstr=atob(parts[1]);
    let n=bstr.length;
    const u8arr=new Uint8Array(n);
    while(n--){u8arr[n]=bstr.charCodeAt(n)}
    return new Blob([u8arr],{type:mime});
  }catch(e){
    return null;
  }
}

function viewFile(id){
  const f=(S.files||[]).find(x=>x.id===id);
  if(!f||!f.data)return alert('ไม่พบไฟล์เอกสาร');
  const blob=getFileBlob(f);
  if(!blob)return alert('ไฟล์ไม่สมบูรณ์ หรือเกิดข้อผิดพลาดในการเปิด');
  const blobUrl=URL.createObjectURL(blob);
  window.open(blobUrl,'_blank');
}

function downloadFile(id){
  const f=(S.files||[]).find(x=>x.id===id);
  if(!f||!f.data)return alert('ไม่พบไฟล์เอกสาร');
  const blob=getFileBlob(f);
  if(!blob)return alert('ไฟล์ไม่สมบูรณ์ หรือเกิดข้อผิดพลาดในการดาวน์โหลด');
  const blobUrl=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=blobUrl;
  a.download=f.filename||(f.title+'.pdf');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(blobUrl),15000);
}

  $('#f_input').addEventListener('change',function(e){

      alert('กรุณาเลือกไฟล์ PDF เท่านั้น');
      e.target.value='';
      $('#f_info').textContent='';
      return;
    }
    const szMB=(file.size/(1024*1024)).toFixed(2);
    if(file.size>15*1024*1024){
      alert(`ไฟล์มีขนาด ${szMB} MB ซึ่งเกินขีดจำกัด 15 MB กรุณาย่อขนาดไฟล์ PDF ก่อนอัปโหลด`);
      e.target.value='';
      $('#f_info').textContent='';
      return;
    }
    $('#f_info').textContent=`📄 ไฟล์ที่เลือก: ${file.name} (${szMB} MB)`;
    if(!$('#f_title').value){
      $('#f_title').value=file.name.replace(/\.[^/.]+$/,'');
    }
  });
}

async function saveFile(id){
  const title=($('#f_title').value||'').trim();
  const fileInput=$('#f_input');
  const file=fileInput.files&&fileInput.files[0];
  const errBox=$('#f_err');
  errBox.textContent='';

  const oldDoc=id?(S.files||[]).find(x=>x.id===id):null;

  if(!title){
    errBox.textContent='กรุณาระบุชื่อเอกสาร';
    return;
  }
  if(!file&&!oldDoc){
    errBox.textContent='กรุณาเลือกไฟล์ PDF ที่ต้องการอัปโหลด';
    return;
  }

  const saveBtn=$('#f_save_btn');
  saveBtn.disabled=true;
  saveBtn.textContent='กำลังบันทึก...';

  const doSave=async(dataUrl,filename,sz,szStr)=>{
    try{
      const docObj={
        id:id||uid(),
        title:title,
        category:$('#f_cat').value,
        desc:($('#f_desc').value||'').trim(),
        filename:filename,
        size:sz,
        sizeStr:szStr,
        data:dataUrl,
        date:oldDoc?oldDoc.date:today(),
        by:oldDoc?oldDoc.by:((me&&me.name)||'ผู้ใช้')
      };
      await save('files',docObj);
      closeM();
    }catch(err){
      errBox.textContent='บันทึกไม่สำเร็จ: '+err.message;
      saveBtn.disabled=false;
      saveBtn.textContent='บันทึกเอกสาร';
    }
  };

  if(file){
    const reader=new FileReader();
    reader.onerror=()=>{
      errBox.textContent='ไม่สามารถอ่านไฟล์ได้';
      saveBtn.disabled=false;
      saveBtn.textContent='บันทึกเอกสาร';
    };
    reader.onload=async()=>{
      const sz=file.size;
      const szStr=sz>1024*1024?(sz/(1024*1024)).toFixed(2)+' MB':Math.round(sz/1024)+' KB';
      await doSave(reader.result,file.name,sz,szStr);
    };
    reader.readAsDataURL(file);
  }else if(oldDoc){
    await doSave(oldDoc.data,oldDoc.filename,oldDoc.size,oldDoc.sizeStr);
  }
}

const closeAlert=()=>$('#maskAlert').classList.remove('open');

function getDepositDaysLeft(dueDate){
  if(!dueDate)return null;
  const target=new Date(dueDate+(dueDate.length===10?'T00:00:00':''));
  if(isNaN(target.getTime()))return null;
  const now=new Date();
  target.setHours(0,0,0,0);
  now.setHours(0,0,0,0);
  return Math.round((target.getTime()-now.getTime())/(1000*60*60*24));
}

function getUrgentDeposits(){
  return (S.deposits||[]).filter(d=>{
    if(d.status==='ได้รับคืนแล้ว')return false;
    const days=getDepositDaysLeft(d.dueDate);
    return days!==null&&days<=30;
  }).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));
}

    <div class="top">
      <div>
        <h1>${id?'แก้ไขรายการเงินค้ำประกัน':'เพิ่มรายการเงินค้ำประกันใหม่'}</h1>
        <div class="sub">บันทึกข้อมูลเงินค้ำประกันสัญญาและกำหนดวันครบกำหนดคืนเงิน</div>
      </div>
      <button class="btn s" onclick="closeM()" title="ปิด" style="font-size:18px;line-height:1;padding:6px 12px">✕</button>
    </div>
    <div class="f">
      <div class="w2">
        <label>กลุ่ม / บริษัท *</label>
        <select id="dep_g" onchange="autoFillDepInName(this.value)">
          <option value="dr" ${curDep.group==='dr'?'selected':''}>ดีอาร์บัสบอดี้ (หจก. ดีอาร์.บัสบอดี้)</option>
          <option value="daorung" ${curDep.group==='daorung'?'selected':''}>ดาวรุ่งทราเวล (หจก. ดาวรุ่งทราเวล)</option>
          <option value="other" ${curDep.group==='other'?'selected':''}>อื่นๆ</option>
        </select>
      </div>
      <div class="w2">
        <label>ในนาม * (เช่น ดีอาร์(โอน), ดาวรุ่ง(LG), ดีอาร์(เช็ค))</label>
        <input id="dep_in" value="${esc(curDep.inName||'')}">
      </div>
      <div class="w4">
        <label>รายการ / ชื่อหน่วยงาน * (เช่น ท่าเรือสัตหีบ, SCG ลำปาง, การไฟฟ้า(แม่เมาะ))</label>
        <input id="dep_t" value="${esc(curDep.title||'')}" placeholder="ระบุชื่อหน่วยงานหรือโครงการ">
      </div>
      <div class="w2">
        <label>ยอดเงินค้ำประกัน (บาท) *</label>
        <input id="dep_a" type="number" step="0.01" value="${curDep.amount!==''?curDep.amount:''}" placeholder="0.00">
      </div>
      <div class="w2">
        <label>ระยะเวลาสัญญา (เช่น 320 วัน, 5 ปี, 9 เดือน, 3 ปี)</label>
        <input id="dep_dur" value="${esc(curDep.duration||'')}" placeholder="เช่น 5 ปี หรือ 320 วัน">
      </div>
      <div class="w2">
        <label>วันเริ่มต้นสัญญาจ้าง</label>
        <input id="dep_cs" type="date" value="${curDep.contractStart||''}">
      </div>
      <div class="w2">
        <label>วันสิ้นสุดสัญญาจ้าง</label>
        <input id="dep_ce" type="date" value="${curDep.contractEnd||''}">
      </div>
      <div class="w2">
        <label>วันสิ้นสุดครบกำหนดเงินค้ำประกัน *</label>
        <input id="dep_due" type="date" value="${curDep.dueDate||''}">
      </div>
      <div class="w2">
        <label>สถานะ</label>
        <select id="dep_st">
          <option value="ค้ำประกันอยู่" ${curDep.status==='ค้ำประกันอยู่'?'selected':''}>ค้ำประกันอยู่</option>
          <option value="รอขอคืนเงิน" ${curDep.status==='รอขอคืนเงิน'?'selected':''}>รอขอคืนเงิน</option>
          <option value="ได้รับคืนแล้ว" ${curDep.status==='ได้รับคืนแล้ว'?'selected':''}>ได้รับคืนแล้ว</option>
        </select>
      </div>
      <div class="w4">
        <label>หมายเหตุ</label>
        <textarea id="dep_nt" rows="2" placeholder="เช่น เลขที่สัญญา, เลขที่หนังสือค้ำประกันธนาคาร">${esc(curDep.note||'')}</textarea>
      </div>
    </div>
    <div id="dep_err" style="color:var(--bad);font-weight:600;margin-top:10px;font-size:13px"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
      <div>
        ${id&&isAdmin()?`<button class="btn s d" onclick="delDeposit('${id}')">ลบรายการนี้</button>`:''}
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn s" onclick="closeM()">ยกเลิก</button>
        <button class="btn p" onclick="saveDeposit('${id||''}')">บันทึกข้อมูล</button>
      </div>
    </div>
  `);
}

function autoFillDepInName(val){
  const el=$('#dep_in');
  if(!el)return;
  if(val==='dr'&&(!el.value||el.value.startsWith('ดาวรุ่ง'))){
    el.value='ดีอาร์(โอน)';
  }else if(val==='daorung'&&(!el.value||el.value.startsWith('ดีอาร์'))){
    el.value='ดาวรุ่ง(LG)';
  }
}

async function saveDeposit(id){
  const g=$('#dep_g').value;
  const inName=$('#dep_in').value.trim();
  const title=$('#dep_t').value.trim();
  const amount=parseFloat($('#dep_a').value);
  const duration=$('#dep_dur').value.trim();
  const contractStart=$('#dep_cs').value;
  const contractEnd=$('#dep_ce').value;
  const dueDate=$('#dep_due').value;
  const status=$('#dep_st').value;
  const note=$('#dep_nt').value.trim();
  const errBox=$('#dep_err');

  if(!title){errBox.textContent='กรุณาระบุชื่อหน่วยงาน / รายการ';return}
  if(isNaN(amount)||amount<0){errBox.textContent='กรุณาระบุยอดเงินที่ถูกต้อง';return}
  if(!dueDate){errBox.textContent='กรุณาระบุวันสิ้นสุดครบกำหนดเงินค้ำประกัน';return}

  const company=g==='dr'?'ดีอาร์บัสบอดี้':g==='daorung'?'ดาวรุ่งทราเวล':'อื่นๆ';
  const depObj={
    id:curDep.id,
    group:g,
    company,
    inName:inName||(g==='dr'?'ดีอาร์':'ดาวรุ่ง'),
    title,
    amount,
    duration:duration||'-',
    contractStart,
    contractEnd,
    dueDate,
    status,
    note,
    updatedAt:new Date().toISOString()
  };

  try{
    await save('deposits',depObj);
    closeM();
  }catch(e){
    errBox.textContent='เกิดข้อผิดพลาดในการบันทึก: '+e.message;
  }
}

async function delDeposit(id){
  if(!confirm('ยืนยันการลบรายการเงินค้ำประกันนี้?'))return;
  try{
    await del('deposits',id);
    closeM();
  }catch(e){
    alert('ลบไม่สำเร็จ: '+e.message);
  }
}

/* ---------- print ---------- */
function prt(id,later){
  const d=S.docs.find(x=>x.id===id),c=calc(d),co=S.co,Q=d.type==='quote',dl=d.type==='delivery';
  $('#pa').setAttribute('style',({quote:'--c1:#15803d;--c2:#86d19b;--c3:#e1f3e6',bill:'--c1:#1b6fb5;--c2:#9cc3e6;--c3:#e3eef8',receipt:'--c1:#dc2626;--c2:#f4a3a3;--c3:#fde4e4',delivery:'--c1:#c2410c;--c2:#fdba74;--c3:#ffedd5'})[d.type]);
  $('#pa').innerHTML=`<div style="display:flex;align-items:center;gap:18px;color:var(--c1)"><img src="${({quote:LHG,bill:LH,receipt:LHR,delivery:LHO})[d.type]}" alt="" style="width:105px;height:auto;display:block"><div style="flex:1"><div style="font-size:24px;font-weight:700;line-height:1.3">${esc(co.name)}</div><div style="font-size:16px;font-weight:600;margin-top:2px">เลขประจำตัวผู้เสียภาษี : ${esc(co.tax)}</div><div style="font-size:12.5px;font-weight:600;color:var(--c1);margin-top:6px">${esc(co.addr)} ${co.tel?'Tel: '+esc(co.tel):''} ${co.email?' E-mail: '+esc(co.email):''}</div></div></div>
  <div style="height:4px;background:linear-gradient(90deg,var(--c1) 0 28%,var(--c2) 28% 100%);margin:10px 0 12px;-webkit-print-color-adjust:exact;print-color-adjust:exact"></div>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--c1);padding-bottom:8px;margin-bottom:14px"><h2 style="margin:0;color:var(--c1);font-size:24px">${TT[d.type]}</h2>
  <div style="text-align:right"><div>เลขที่ <b>${esc(d.no)}</b></div><div>${(d.date&&d.date.trim())?`วันที่ ${fd(d.date)}`:`วันที่ .....................................`}</div>${d.due?`<div>${Q?'ยืนราคาถึง':dl?'กำหนดส่งมอบ':'ครบกำหนด'} ${fd(d.due)}</div>`:''}${d.type==='receipt'?`<div>ชำระโดย ${esc(d.pay||'')}</div>`:''}</div></div>
  <div style="margin-bottom:14px"><b>ลูกค้า:</b> ${esc(d.cname)}<br>${esc(d.caddr)}${d.ctax?'<br>เลขผู้เสียภาษี '+esc(d.ctax):''}${d.ref?'<br><b>อ้างอิง:</b> '+esc(d.ref):''}</div>
  <table><tr><th style="width:60px;text-align:center;white-space:nowrap">ลำดับ</th><th style="text-align:center">รายการ</th><th style="text-align:center">จำนวน</th><th style="text-align:center">หน่วย</th>${dl?'':'<th>ราคา/หน่วย</th><th>รวม</th>'}</tr>${d.items.map((i,k)=>`<tr><td style="text-align:center">${k+1}</td><td>${esc(i.d)}</td><td style="text-align:center">${i.q}</td><td style="text-align:center">${esc(i.u)}</td>${dl?'':`<td style="text-align:right">${money(i.p)}</td><td style="text-align:right">${money(i.q*i.p)}</td>`}</tr>`).join('')}</table>
  ${dl?'':`<div style="margin:12px 0 0 auto;width:280px">${trows(c).map(x=>`<div style="display:flex;justify-content:space-between"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}<div style="display:flex;justify-content:space-between;font-weight:700;font-size:18px;border-top:2px solid var(--c1);color:var(--c1);margin-top:4px;padding-top:4px"><span>ยอดสุทธิ</span><span>${money(c.tot)}</span></div></div>`}
  ${dl?'<p>ได้รับสินค้า/งานตามรายการข้างต้นไว้ในสภาพเรียบร้อยและครบถ้วนถูกต้องแล้ว</p>':''}${d.type==='receipt'?'<p>ได้รับเงินตามรายการข้างต้นไว้ถูกต้องเรียบร้อยแล้ว</p>':''}${d.note?`<p><b>หมายเหตุ:</b><br>${esc(d.note).replace(/\n/g,'<br>')}</p>`:''}${d.type==='bill'&&co.bank?`<p><b>ชำระเงินโอนเข้า:</b> ${esc(co.bank)}</p>`:''}
  <div style="display:flex;justify-content:${Q?'flex-end;padding-right:60px':'space-around'};margin-top:60px;text-align:center">${(Q?[['ผู้เสนอราคา',d.signer]]:d.type==='bill'?[['ผู้วางบิล',d.signer],['ผู้รับวางบิล','']]:dl?[['ผู้ส่งมอบ',d.signer],['ผู้รับมอบ','']]:[['ผู้ชำระเงิน',''],['ผู้รับเงิน',d.signer]]).map(t=>`<div>________________<br>${t[1]?'('+esc(t[1])+')':'&nbsp;'}<br>${t[0]}<br><span style="font-size:13px">วันที่ .....................................</span></div>`).join('')}</div>`;
  setTimeout(()=>window.print(),later?250:0);
}
init();
</script>
</body>
</html>
